project:
  type: book

knitr:
  opts_chunk:
    dev: "ragg_png"

filters:
  - book.lua

book:
  title: "Elementary Statistics for Social Sciences II"
  subtitle: "208272 (Part 1)"
  author: "Asst. Prof. Dr. Parichart Pattarapanitchai"
  downloads: [pdf]
  date: "today"
  chapters:
    - index.qmd
    - chapter01_principles.qmd
    - chapter02_one_sample.qmd
    - chapter03_two_sample.qmd
    - chapter04_anova.qmd
    - summary_choosing_method.qmd
  appendices:
    - appendix_tables.qmd

format:
  html:
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    theme: cosmo
    highlight-style: github
    number-sections: true
    number-depth: 2
    fig-width: 8
    fig-height: 5
    # R code is folded on the web; the output is always shown
    code-fold: true
    code-summary: "Show R code"
    echo: true
  pdf:
    pdf-engine: xelatex
    documentclass: scrreprt
    toc: true
    toc-depth: 2
    number-sections: true
    # LaTeX counts chapter as level 0, so depth 1 numbers sections (2.1) only
    number-depth: 1
    geometry: margin=1in
    fontsize: 12pt
    # The PDF shows R output only, never the code
    echo: false

execute:
  echo: false
  warning: false
  message: false
