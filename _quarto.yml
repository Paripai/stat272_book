project:
  type: book

knitr:
  opts_chunk:
    dev: "ragg_png"

filters:
  - book.lua

book:
  title: "Elementary Statistics for Social Sciences II"
  subtitle: "208272 (Part 1)"
  author: "Asst. Prof. Dr. Parichart Pattarapanitchai"
  downloads: [pdf]
  date: "today"
  chapters:
    - index.qmd
    - chapter01_principles.qmd
    - chapter02_one_sample.qmd
    - chapter03_two_sample.qmd
    - chapter04_anova.qmd
    - summary_choosing_method.qmd

format:
  html:
    toc: true
    toc-depth: 3
    toc-title: "Contents"
    theme: cosmo
    highlight-style: github
    number-sections: true
    number-depth: 2
    fig-width: 8
    fig-height: 5
    # R code is hidden by default. Chunks that show R output for students set
    # echo: !expr show_code, so the command is printed above its output.
  pdf:
    pdf-engine: xelatex
    documentclass: scrreprt
    toc: true
    toc-depth: 2
    number-sections: true
    # LaTeX counts chapter as level 0, so depth 1 numbers sections (2.1) only
    number-depth: 1
    geometry: margin=1in
    fontsize: 12pt

execute:
  echo: false
  warning: false
  message: false
